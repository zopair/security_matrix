name: Nuclei DAST

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuclei-dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-local-app:
    name: Scan isolated local test instance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start local test app
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/securitymatrix-uvicorn.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then
              echo "Local test app is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/securitymatrix-uvicorn.log
          exit 1

      - name: Run Nuclei against loopback only
        uses: projectdiscovery/nuclei-action@32a91c0da7be14c07b0ade6c14fa0f6e78d97c9c # v3.1.0
        with:
          args: >-
            -u http://127.0.0.1:8000
            -tags misconfig,exposure
            -severity medium,high,critical
            -rate-limit 2
            -c 2
            -timeout 5
            -retries 0
            -no-interactsh
            -jsonl
            -o nuclei-results.jsonl

      - name: Normalize Nuclei findings for SOC
        if: always()
        run: python scripts/normalize_security_findings.py

      - name: Optionally send findings to SecurityMatrix SOC
        if: always()
        env:
          SECURITYMATRIX_INGEST_URL: ${{ secrets.SECURITYMATRIX_INGEST_URL }}
          SECURITYMATRIX_INGEST_TOKEN: ${{ secrets.SECURITYMATRIX_INGEST_TOKEN }}
        run: |
          if [ -z "$SECURITYMATRIX_INGEST_URL" ] || [ -z "$SECURITYMATRIX_INGEST_TOKEN" ]; then
            echo "SOC ingest secrets are not configured; findings remain in the workflow artifact."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $SECURITYMATRIX_INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @security-findings.json \
            "$SECURITYMATRIX_INGEST_URL/api/security/findings"

      - name: Upload Nuclei report and normalized findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuclei-dast-report-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            nuclei-results.jsonl
            security-findings.json
