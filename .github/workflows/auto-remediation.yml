name: Auto Remediation Proposal

on:
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/auto-remediation.yml'
      - 'scripts/prepare_remediation.py'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: auto-remediation-main
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML
        run: ruby -e "require 'yaml'; YAML.load_file('.github/workflows/auto-remediation.yml')"

  propose-dependency-fixes:
    name: Audit and propose direct dependency fixes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit packaging

      - name: Audit current dependency tree
        continue-on-error: true
        run: pip-audit -r requirements.txt --format json --output pip-audit.json

      - name: Prepare conservative direct-dependency patch
        id: remediate
        run: python scripts/prepare_remediation.py

      - name: Install proposed dependency set
        if: steps.remediate.outputs.changed == 'true'
        run: python -m pip install -r requirements.txt

      - name: Run tests against proposed fix
        if: steps.remediate.outputs.changed == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Re-audit proposed dependency set
        if: steps.remediate.outputs.changed == 'true'
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: Open review-only pull request
        if: steps.remediate.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: securitymatrix/automated-dependency-remediation
          delete-branch: true
          commit-message: "fix: propose audited dependency security updates"
          title: "Security: propose audited dependency updates"
          body: |
            ## Automated remediation proposal

            This pull request updates direct dependency constraints when pip-audit reports a published fixed version.

            - Generated by the scheduled/manual SecurityMatrix workflow.
            - The patch is a proposal only; it is not merged or deployed automatically.
            - Review the audit report, compatibility, and CI results before merging.
            - Transitive dependency issues or findings without a compatible fixed version may remain.
          add-paths: |
            requirements.txt
