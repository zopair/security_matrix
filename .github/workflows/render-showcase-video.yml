name: Render enterprise project overview
on:
  push:
    branches: [feat/enterprise-showcase-video]
    paths:
      - 'video/showcase.json'
      - 'scripts/render_showcase.py'
      - '.github/workflows/render-showcase-video.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: showcase-video-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Install local rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install Pillow==11.3.0 kokoro-onnx==0.5.0 soundfile==0.13.1
          mkdir -p .cache/kokoro
          curl --fail --location --retry 3 --output .cache/kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl --fail --location --retry 3 --output .cache/kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
      - name: Render narrated MP4 with Kokoro
        run: python scripts/render_showcase.py
      - name: Commit generated video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/marketing/project-overview.mp4
          if git diff --cached --quiet; then echo "No video changes."; else git commit -m "media: add narrated enterprise project overview" && git push origin HEAD:${{ github.ref_name }}; fi
