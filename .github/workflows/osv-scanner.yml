name: OSV dependency scan

on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "requirements*.txt"
      - "pyproject.toml"
      - "poetry.lock"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - ".github/workflows/osv-scanner.yml"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: osv-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scheduled-scan:
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        -r
        ./
      fail-on-vuln: false
      upload-sarif: true

  pull-request-scan:
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        -r
        ./
      fail-on-vuln: true
      upload-sarif: true
